services:
  backend:
    build: .
    image: vivekhegde78/tripmate-backend:v1
    env_file:
      - ./langgraph-backend/.env
    ports:
      - "127.0.0.1:8000:8000"

  frontend:
    build: ./frontend
    image: vivekhegde78/tripmate-frontend:v1
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend