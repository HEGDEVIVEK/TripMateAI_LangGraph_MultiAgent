  deploy-to-ec2:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy updated images
        run: |
          cd ~/TripMateAI_LangGraph_MultiAgent
          sudo docker compose -f compose.prod.yaml pull
          sudo docker compose -f compose.prod.yaml up -d --remove-orphans
          sudo docker image prune -f
